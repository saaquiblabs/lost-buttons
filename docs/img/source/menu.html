<!doctype html>
<!-- docs/img/menu.png: the `lost-buttons` menu (Sources/Menu.swift) with Lost Buttons running and a
     Kreo Chimera plugged in, drawn as a Terminal window. Re-render after changing the menu:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
       --force-device-scale-factor=2 --window-size=640,420 --screenshot=docs/img/menu.png docs/img/source/menu.html -->
<html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
html,body{width:640px;height:420px;background:transparent}
body{display:grid;place-items:center;font:14px/1.6 ui-monospace,"SF Mono",Menlo,monospace}
.win{width:600px;height:380px;border-radius:12px;overflow:hidden;background:#151A22;color:#E9E6DF;
  box-shadow:0 0 0 1px rgb(255 255 255/.08) inset,0 16px 32px -12px rgb(0 0 0/.5)}
.bar{height:32px;display:flex;align-items:center;gap:8px;padding:0 12px;background:#1E2530;color:#A9AFB8;font:500 12px -apple-system,system-ui,sans-serif}
.bar i{width:12px;height:12px;border-radius:50%}.bar i:nth-child(1){background:#ff5f57}.bar i:nth-child(2){background:#febc2e}.bar i:nth-child(3){background:#28c840}
.bar span{flex:1;text-align:center;margin-right:52px}
pre{padding:16px 22px;font:inherit;white-space:pre}
.t{color:#FF8A3D;font-weight:700}.d{color:#8A919C}.g{color:#5FD38A}.s{color:#FF8A3D;font-weight:700}
</style></head><body><div class="win"><div class="bar"><i></i><i></i><i></i><span>lost-buttons</span></div>
<pre>
  <span class="t">Lost Buttons</span> <span class="d">0.4.0</span>

  <span class="g">●</span> Running in the background
  Fixing: K Chimera

  <span class="s">▶ Stop Lost Buttons</span>
    Check my mice
    Allow Input Monitoring
    Allow Accessibility
    Quit

  <span class="d">Stops it now and at every login.</span>

  <span class="d">↑↓ move · Enter choose · Esc quit</span></pre></div></body></html>
